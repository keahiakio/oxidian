[package]
name = "oxidian"
version = "0.1.0"
edition = "2021"
authors = ["Kiwi Akio <keahiakio@users.noreply.github.com>"]
description = "A fast CLI & Neovim-aesthetic TUI for Obsidian vaults in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/keahiakio/oxidian"
readme = "README.md"
keywords = ["obsidian", "neovim", "tui", "ratatui", "markdown"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
regex = "1.11"
chrono = "0.4"
fuzzy-matcher = "0.3"
unicode-width = "0.2"
dirs = "6.0"
