[package]
name = "oxidian"
version = "0.1.0"
edition = "2021"
authors = ["keahiakio"]
description = "A fast CLI & Neovim-aesthetic TUI for Obsidian vaults in Rust"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
regex = "1.11"
chrono = "0.4"
fuzzy-matcher = "0.3"
unicode-width = "0.2"
dirs = "6.0"
